# =========================================================
# CityCenter — Docker Compose (Production)
# =========================================================
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose up -d
#   3. docker compose logs -f app
# =========================================================
version: "3.9"

services:
  # ---------------------------------------------------------
  # MySQL Database
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: citycenter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-changeme_root}
      MYSQL_DATABASE: ${DB_NAME:-shop_charge_db}
      MYSQL_USER: ${DB_USER:-citycenter}
      MYSQL_PASSWORD: ${DB_PASS:-changeme_user}
      TZ: Asia/Tehran
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - citycenter_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-changeme_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    # Do NOT expose MySQL publicly. The app service connects via the internal network.
    # Uncomment the following only if you need external DB access (e.g. from a GUI client):
    # ports:
    #   - "3306:3306"

  # ---------------------------------------------------------
  # Application (Node.js)
  # ---------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: citycenter:latest
    container_name: citycenter-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # These override .env values for the containerized environment.
      NODE_ENV: production
      PORT: 3514
      TZ: Asia/Tehran
      DB_HOST: mysql
      DB_PORT: 3306
      # TRUST_PROXY is read from .env (default 1)
    volumes:
      # Persist uploaded receipts across container restarts.
      - ./public/uploads:/app/public/uploads
      # Persist application logs.
      - ./logs:/app/logs
      # Persist database backups across container restarts.
      - ./backups:/app/backups
    networks:
      - citycenter_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3514/login', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Port 3514 is NOT exposed to the host — only reachable via nginx.
    # Uncomment the line below ONLY if you want to bypass nginx for debugging.
    # ports:
    #   - "${PORT:-3514}:3514"

  # ---------------------------------------------------------
  # Nginx reverse proxy
  # ---------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: citycenter-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/app/public/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - citycenter_net

# ---------------------------------------------------------
# Named volumes (managed by Docker)
# ---------------------------------------------------------
volumes:
  mysql_data:
    driver: local

# ---------------------------------------------------------
# Internal network
# ---------------------------------------------------------
networks:
  citycenter_net:
    driver: bridge
