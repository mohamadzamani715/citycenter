# =========================================================
# CityCenter — Nginx Reverse Proxy Configuration
# =========================================================
#
# Purpose:
#   - Terminate SSL (HTTPS) and forward plain HTTP to the Node.js app.
#   - Set X-Forwarded-Proto so that Express + trust proxy knows it is HTTPS.
#   - Serve static uploads efficiently (optional direct serving).
#   - Provide basic security headers as defense-in-depth.
#
# Usage (Docker):
#   This file is mounted to /etc/nginx/conf.d/default.conf inside the nginx container.
#
# Usage (bare-metal):
#   Copy to /etc/nginx/sites-available/citycenter
#   ln -s /etc/nginx/sites-available/citycenter /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# IMPORTANT: This is a TEMPLATE. Replace `your-domain.com` with the actual
# domain BEFORE deploying. Also replace the SSL certificate paths.
# =========================================================

# ---------------------------------------------------------
# Upstream: the Node.js application
# ---------------------------------------------------------
# In Docker, "app" is the service name in docker-compose.yml.
# On bare-metal, use "127.0.0.1:3514" instead of "app:3514".
upstream citycenter_app {
    server app:3514;
    keepalive 32;
}

# ---------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Allow Let's Encrypt HTTP-01 challenge through without redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------
# HTTPS server
# ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # ----- SSL certificates (Let's Encrypt default paths) -----
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ----- SSL hardening (modern, secure defaults) -----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ----- Security headers (defense-in-depth; app also uses Helmet) -----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----- Client body size (for receipt uploads) -----
    # Max 5 MB. Adjust if receipts are larger.
    client_max_body_size 5M;

    # ----- Timeouts -----
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ----- Access and error logs -----
    access_log /var/log/nginx/citycenter.access.log;
    error_log  /var/log/nginx/citycenter.error.log warn;

    # ---------------------------------------------------------
    # Main location: proxy everything to the Node.js app
    # ---------------------------------------------------------
    location / {
        proxy_pass http://citycenter_app;
        proxy_http_version 1.1;

        # Required for WebSocket / keepalive support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original client information to the app.
        # Express reads X-Forwarded-Proto (via `trust proxy`) to decide
        # whether the connection is HTTPS — this is what makes the
        # `secure` cookie flag actually work.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Do not cache HTML responses (they contain CSRF tokens).
        proxy_cache_bypass $http_upgrade;
    }

    # ---------------------------------------------------------
    # (Optional) Serve /uploads directly from disk
    # ---------------------------------------------------------
    # The Node.js app already serves /uploads via express.static.
    # Serving them directly from Nginx is faster and reduces app load.
    # Uncomment to enable. Make sure the path matches the volume mount
    # in docker-compose.yml (./public/uploads → /app/public/uploads).
    #
    # location /uploads/ {
    #     alias /app/public/uploads/;
    #     expires 7d;
    #     add_header Cache-Control "public, max-age=604800";
    #     access_log off;
    # }
}
